<div class="container">
  <mat-form-field>
    <input id="num" [value]="displayValue" matInput type="text" disabled>
  </mat-form-field>

  <div *ngFor="let row of buttonRows; trackBy: trackByIndex">
    <button
      *ngFor="let button of row"
      mat-flat-button
      type="button"
      (click)="onButtonClick(button)"
    >
      {{ button.label }}
    </button>
  </div>
</div>
